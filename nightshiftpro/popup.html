<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NightShift Pro</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <img src="icons/icon48.png" alt="NightShift Pro" class="brand-icon" />
        <div>
          <h1>NightShift Pro</h1>
          <p class="subtitle">Adaptive Dark Mode Studio</p>
        </div>
      </div>
      <label class="switch" title="Global Dark Mode">
        <input type="checkbox" id="toggle-global" checked />
        <span class="slider"></span>
      </label>
    </header>

    <div class="site-card">
      <div class="site-info">
        <span class="site-label">Current Site</span>
        <strong id="site-host">example.com</strong>
      </div>
      <button id="btn-site-toggle" class="site-btn">Active</button>
    </div>

    <section class="section">
      <h2>Eye-Care Presets</h2>
      <div class="presets">
        <button class="preset-btn active" data-preset="midnight">🌙 Midnight</button>
        <button class="preset-btn" data-preset="amber">🔥 Warm Amber</button>
        <button class="preset-btn" data-preset="slate">🪨 Soft Slate</button>
      </div>
    </section>

    <section class="section sliders-box">
      <div class="slider-row">
        <div class="slider-head">
          <span>Brightness</span>
          <strong id="val-brightness">100%</strong>
        </div>
        <input type="range" id="range-brightness" min="65" max="120" value="100" />
      </div>

      <div class="slider-row">
        <div class="slider-head">
          <span>Contrast</span>
          <strong id="val-contrast">100%</strong>
        </div>
        <input type="range" id="range-contrast" min="80" max="125" value="100" />
      </div>

      <div class="slider-row">
        <div class="slider-head">
          <span>Warmth (Sepia)</span>
          <strong id="val-sepia">10%</strong>
        </div>
        <input type="range" id="range-sepia" min="0" max="60" value="10" />
      </div>
    </section>

    <footer class="footer">
      <button id="btn-reset" class="btn-reset">Reset Defaults</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
