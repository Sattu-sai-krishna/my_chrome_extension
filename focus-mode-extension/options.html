<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Focus Mode Settings</title>
    <style>
        body { 
            width: 320px; 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            background: #f5f5f5;
            color: #333;
        }
        .setting { 
            background: white;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        label { display: block; margin-bottom: 8px; font-weight: 500; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { 
            width: 100%; 
            padding: 12px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }
        .section { margin-bottom: 20px; }
        .section-title { 
            font-size: 14px; 
            font-weight: 600; 
            color: #666; 
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h2>Focus Mode Settings</h2>
    
    <div class="section">
        <div class="section-title">Session Duration</div>
        <div class="setting">
            <label>Focus Duration (minutes)</label>
            <input type="number" id="focusDuration" min="5" max="120" value="25">
        </div>
        <div class="setting">
            <label>Break Duration (minutes)</label>
            <input type="number" id="breakDuration" min="5" max="30" value="5">
        </div>
    </div>
    
    <div class="section">
        <div class="section-title">Daily Goal</div>
        <div class="setting">
            <label>Daily Goal (minutes)</label>
            <input type="number" id="dailyGoal" min="30" max="480" value="60">
        </div>
    </div>
    
    <button id="saveBtn">Save Settings</button>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            chrome.storage.sync.get({
                focusDuration: 25,
                breakDuration: 5,
                dailyGoal: 60
            }, (settings) => {
                document.getElementById('focusDuration').value = settings.focusDuration;
                document.getElementById('breakDuration').value = settings.breakDuration;
                document.getElementById('dailyGoal').value = settings.dailyGoal;
            });
            
            document.getElementById('saveBtn').addEventListener('click', () => {
                const settings = {
                    focusDuration: parseInt(document.getElementById('focusDuration').value),
                    breakDuration: parseInt(document.getElementById('breakDuration').value),
                    dailyGoal: parseInt(document.getElementById('dailyGoal').value)
                };
                chrome.storage.sync.set(settings, () => {
                    alert('Settings saved!');
                    window.close();
                });
            });
        });
    </script>
</body>
</html>
