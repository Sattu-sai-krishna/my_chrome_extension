<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tab Organizer Pro - Settings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 360px; 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
        }
        .container { 
            max-width: 360px;
            margin: 0 auto;
            padding: 24px;
        }
        h1 { 
            font-size: 24px;
            margin-bottom: 20px;
            color: #1a1a2e;
        }
        .setting-group {
            background: white;
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .setting-group h3 {
            font-size: 16px;
            margin-bottom: 16px;
            color: #333;
        }
        .setting {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #666;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
        }
        .save-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .save-btn:hover { transform: translateY(-2px); }
        .note { 
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Tab Organizer Settings</h1>
        
        <div class="setting-group">
            <h3>Focus Sessions</h3>
            <div class="setting">
                <label>Focus Duration (minutes)</label>
                <input type="number" id="focusDuration" min="10" max="120" value="25">
                <div class="note">Session length before suggested break</div>
            </div>
            <div class="setting">
                <label>Break Duration (minutes)</label>
                <input type="number" id="breakDuration" min="5" max="30" value="5">
                <div class="note">Rest time between sessions</div>
            </div>
        </div>
        
        <div class="setting-group">
            <h3>Productivity Goals</h3>
            <div class="setting">
                <label>Daily Goal (minutes)</label>
                <input type="number" id="dailyGoal" min="30" max="480" value="60">
                <div class="note">Target productive focus time per day</div>
            </div>
        </div>
        
        <button class="save-btn" id="saveSettings">Save Settings</button>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            chrome.storage.sync.get({
                focusDuration: 25,
                breakDuration: 5,
                dailyGoal: 60
            }, (settings) => {
                document.getElementById('focusDuration').value = settings.focusDuration;
                document.getElementById('breakDuration').value = settings.breakDuration;
                document.getElementById('dailyGoal').value = settings.dailyGoal;
            });
            
            document.getElementById('saveSettings').addEventListener('click', () => {
                const settings = {
                    focusDuration: parseInt(document.getElementById('focusDuration').value),
                    breakDuration: parseInt(document.getElementById('breakDuration').value),
                    dailyGoal: parseInt(document.getElementById('dailyGoal').value)
                };
                
                chrome.storage.sync.set(settings, () => {
                    alert('Settings saved successfully!');
                    window.close();
                });
            });
        });
    </script>
</body>
</html>
