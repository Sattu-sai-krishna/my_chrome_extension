<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tab Organizer Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 380px; 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
        }
        .header { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 { font-size: 20px; font-weight: 600; }
        .header p { font-size: 13px; opacity: 0.9; margin-top: 4px; }
        
        .tab-search { 
            padding: 16px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
        }
        .tab-search input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }
        .tab-search input:focus { border-color: #667eea; box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2); }
        
        .stats-bar { 
            padding: 12px 16px;
            background: #fff;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            font-size: 12px;
        }
        .stat-item { text-align: center; }
        .stat-value { font-weight: 600; color: #667eea; }
        .stat-label { color: #888; }
        
        .tabs-container { 
            max-height: 400px;
            overflow-y: auto;
        }
        .tab-group { margin-bottom: 12px; }
        .group-header {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background: #f8f9fa;
            font-weight: 500;
            font-size: 13px;
            border: 1px solid #eee;
            border-radius: 6px 6px 0 0;
        }
        .group-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .tab-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            font-size: 13px;
        }
        .tab-item:hover { background: #f0f8ff; }
        .favicon { width: 16px; height: 16px; margin-right: 8px; }
        .tab-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tab-close {
            width: 20px;
            height: 20px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .tab-item:hover .tab-close { opacity: 1; }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
            font-size: 14px;
        }
        .empty-icon { font-size: 32px; margin-bottom: 12px; }
        
        .actions { 
            padding: 12px;
            background: #fff;
            border-top: 1px solid #eee;
            display: flex;
            gap: 8px;
        }
        .actions button {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            background: #f8f9fa;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .actions button:hover { background: #e8ecef; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📁 Tab Organizer Pro</h1>
        <p>Organize • Search • Optimize</p>
    </div>
    
    <div class="tab-search">
        <input type="text" id="searchInput" placeholder="Search all tabs...">
    </div>
    
    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-value" id="tabCount">0</div>
            <div class="stat-label">Tabs</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="memoryUsage">0%</div>
            <div class="stat-label">Memory</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="sessionsToday">0</div>
            <div class="stat-label">Sessions</div>
        </div>
    </div>
    
    <div class="tabs-container" id="tabsContainer"></div>
    
    <div class="actions">
        <button id="closeInactive">Close Inactive</button>
        <button id="saveSession">Save Session</button>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
