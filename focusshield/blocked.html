<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusShield — Stay in Flow</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #0d2b2b 0%, #071318 70%);
      color: #f8fafc;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      background: rgba(15, 32, 39, 0.85);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 { font-size: 24px; margin-bottom: 10px; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 22px; }
    .actions { display: flex; gap: 10px; justify-content: center; }
    button {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-back { background: #10b981; color: #052e16; }
    .btn-snooze { background: #162c35; color: #cbd5e1; border: 1px solid rgba(148,163,184,0.25); }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">FocusShield Active</div>
    <h1>Take a breath — stay in flow</h1>
    <p id="msg">This site is paused while your focus session is running.</p>
    <div class="actions">
      <button class="btn-back" id="btn-back">Back to Work</button>
      <button class="btn-snooze" id="btn-snooze">Allow 2 min</button>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const site = params.get("site") || "This site";
    const ret = params.get("return");
    document.getElementById("msg").textContent = `${site} is paused while your FocusShield timer is running.`;
    document.getElementById("btn-back").addEventListener("click", () => history.back());
    document.getElementById("btn-snooze").addEventListener("click", async () => {
      await chrome.runtime.sendMessage({ type: "SNOOZE_BLOCK" });
      if (ret) location.href = ret;
    });
  </script>
</body>
</html>
